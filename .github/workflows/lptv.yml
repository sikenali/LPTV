name: IPTV Daily Update

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      ffprobe:
        description: '对每个频道前 2 条线路执行 FFprobe 解码验证'
        required: false
        default: true
        type: boolean
      sync_sources:
        description: '同时同步上游 vbskycn/iptv 直播源'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  # 默认关闭 FFprobe（定时任务每4小时运行，约需5-7分钟）
  # 手动触发时可勾选 "FFprobe: false" 来跳过验证进一步加速
  # 或手动指定 LPTV_FFPROBE=1 开启（约需20+分钟）
  LPTV_FFPROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.ffprobe != 'false' && '1' || '0' }}

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream IPTV sources
        if: ${{ github.event_name == 'schedule' || github.event.inputs.sync_sources == 'true' }}
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git remote set-url origin $REPO_URL
          mkdir -p sources
          echo "Fetching iptv4.txt ..."
          curl -sSL -o sources/vbskycn-iptv4.txt \
            "https://raw.githubusercontent.com/vbskycn/iptv/refs/heads/master/tv/iptv4.txt"
          echo "Fetching iptv4.m3u ..."
          curl -sSL -o sources/vbskycn-iptv4.m3u \
            "https://raw.githubusercontent.com/vbskycn/iptv/refs/heads/master/tv/iptv4.m3u"
          echo "---"
          wc -l sources/vbskycn-iptv4.*
          # 先 fetch 再 hard reset 到远端，避免 rebase 因未提交改动而失败
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}
          git add sources/
          git diff --quiet && git diff --staged --quiet || git commit -m "sync: 更新 vbskycn/iptv 直播源数据"
          git push --force-with-lease origin HEAD:${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Install FFprobe
        if: ${{ env.LPTV_FFPROBE == '1' }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run scraping script
        run: python .github/workflows/lptv/lptv.py

      - name: Generate Step Summary
        run: |
          python3 - <<'PYEOF'
          import json, os
          stats_file = "run_stats.json"
          summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if not os.path.exists(stats_file) or not summary:
              exit(0)
          data = json.load(open(stats_file, encoding="utf-8"))
          latest = data.get("latest", {})
          history = data.get("history", [])
          prev = history[-2] if len(history) >= 2 else None

          lines = [
              "## 📊 IPTV 更新报告",
              "",
              f"**运行时间** {latest.get('time', '?')}",
              "",
              f"- **频道数**: {latest.get('channels', 0)}",
              f"- **有效流数**: {latest.get('valid_streams', 0)}（去重后 {latest.get('deduplicated', 0)}）",
              f"- **总线路数**: {latest.get('total_urls', 0)}",
          ]
          p50 = latest.get('latency_p50')
          if p50:
              p90 = latest.get('latency_p90', 0)
              p99 = latest.get('latency_p99', 0)
              lines.append(f"- **延迟**: p50={p50:.3f}s  p90={p90:.3f}s  p99={p99:.3f}s")
          lines.append("")

          resolutions = latest.get('resolutions', {})
          if resolutions:
              lines += ["### 分辨率分布", ""]
              lines += ["| 分辨率 | 频道数 |", "|--------|--------|"]
              for res, cnt in sorted(resolutions.items(), key=lambda x: -x[1]):
                  lines.append(f"| {res} | {cnt} |")
              lines.append("")

          if prev:
              chg_ch = latest.get('channels', 0) - prev.get('channels', 0)
              chg_url = latest.get('total_urls', 0) - prev.get('total_urls', 0)
              lines += ["### 📈 对比上次运行", ""]
              lines.append(f"- 频道变化: **{'+' if chg_ch >= 0 else ''}{chg_ch}**（{latest.get('channels', 0)} vs {prev.get('channels', 0)}）")
              lines.append(f"- 线路变化: **{'+' if chg_url >= 0 else ''}{chg_url}**（{latest.get('total_urls', 0)} vs {prev.get('total_urls', 0)}）")
              lines.append("")

          lines.append("---")
          lines.append("*数据来源: GitHub Actions 自动聚合，每4小时更新*")
          open(summary, "w", encoding="utf-8").write("\n".join(lines) + "\n")
          print("[summary] written to GITHUB_STEP_SUMMARY")
          PYEOF

      - name: GetTime
        run: echo "GET_TIME=$(date +'%Y-%m-%d %H:%M:%S CST')" >> $GITHUB_ENV

      - name: Update README.md
        run: |
          file_link="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/channels/lptv.m3u"
          file_link1="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/channels/lptv.m3u8"

          if [ -f README.md ]; then
            sed -i "s|<!-- Last Run Time -->.*|<!-- Last Run Time --> ${GET_TIME}|" README.md
            sed -i "s|<!-- Generated File Link M3U -->.*|<!-- Generated File Link M3U --> [View M3U File](${file_link})|" README.md
            sed -i "s|<!-- Generated File Link M3U8 -->.*|<!-- Generated File Link M3U8 --> [View M3U8 File](${file_link1})|" README.md
          else
            printf '%s\n' \
              "# LPTV - Live TV" \
              "" \
              "<!-- Last Run Time --> <!-- Generated at runtime -->" \
              "" \
              "## Generated Files" \
              "" \
              "<!-- Generated File Link M3U --> [View M3U File](${file_link})" \
              "<!-- Generated File Link M3U8 --> [View M3U8 File](${file_link1})" \
              "" \
              "Auto-generated IPTV playlist updated every 4 hours via GitHub Actions." \
              > README.md
          fi

      - name: Commit changes
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git remote set-url origin $REPO_URL
          # 仅 fetch 远端更新（不 reset），保留脚本生成的 M3U 等更改
          git fetch origin ${{ github.ref_name }}
          # 如果有远端新 commit，尝试 merge（处理并发 workflow 冲突）
          git diff --quiet HEAD origin/${{ github.ref_name }} && true || git merge --no-edit origin/${{ github.ref_name }}
          git add README.md run_stats.json sources/ channels/lptv.m3u channels/lptv.m3u8 logos/
          git diff --quiet && git diff --staged --quiet || git commit -m "自动更新: ${GET_TIME}"
          git push --force-with-lease origin HEAD:${{ github.ref_name }}
