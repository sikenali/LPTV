name: IPTV Daily Update

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run scraping script
        run: python .github/workflows/lptv/lptv.py

      - name: GetTime
        run: echo "GET_TIME=$(date +'%Y-%m-%d %H:%M:%S CST')" >> $GITHUB_ENV

      - name: Update README.md
        run: |
          file_link="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/channels/lptv.m3u"
          file_link1="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/channels/lptv.m3u8"

          if [ -f README.md ]; then
            sed -i "s|<!-- Last Run Time -->.*|<!-- Last Run Time --> ${GET_TIME}|" README.md
            sed -i "s|<!-- Generated File Link M3U -->.*|<!-- Generated File Link M3U --> [View M3U File](${file_link})|" README.md
            sed -i "s|<!-- Generated File Link M3U8 -->.*|<!-- Generated File Link M3U8 --> [View M3U8 File](${file_link1})|" README.md
          else
            cat > README.md << EOF
# LPTV - Live TV

<!-- Last Run Time --> <!-- Generated at runtime -->

## Generated Files

<!-- Generated File Link M3U --> [View M3U File](${file_link})
<!-- Generated File Link M3U8 --> [View M3U8 File](${file_link1})

Auto-generated IPTV playlist updated every 4 hours via GitHub Actions.
EOF
          fi

      - name: Commit changes
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git remote set-url origin $REPO_URL
          git add README.md channels/lptv.m3u channels/lptv.m3u8 logos/
          git diff --quiet && git diff --staged --quiet || git commit -m "自动更新: ${GET_TIME}"
          git push origin main
