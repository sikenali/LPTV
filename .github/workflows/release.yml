name: Release LPK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install lzc-cli
        run: npm install -g @lazycatcloud/lzc-cli

      - name: Install dependencies
        run: npm ci --registry https://registry.npmmirror.com

      - name: Build and package LPK
        working-directory: lzc
        env:
          LPK_VERSION: ${{ github.ref_name }}
        run: bash package.sh

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: v$VERSION"

      - name: Upload LPK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LPTV v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            lzc/cloud.lazycat.app.lptv-${{ steps.version.outputs.version }}.lpk
