name: Release LPK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install lzc-cli
        run: |
          npm install -g @lazycatcloud/lzc-cli
          lzc-cli --version

      - name: Install dependencies
        run: npm ci --registry https://registry.npmmirror.com

      - name: Build and Release LPK
        working-directory: lzc
        env:
          LPK_VERSION: ${{ github.ref_name }}
        run: |
          VERSION=$(echo "${LPK_VERSION}" | sed 's/^v//')
          VERSION="${VERSION:-1.0.0}"
          echo "Building version: $VERSION"
          export LPK_VERSION="$VERSION"
          bash build.sh
          node $(npm root -g)/@lazycatcloud/lzc-cli/scripts/cli.js project release -o output.lpk
          LPK_NAME="cloud.lazycat.app.lptv-${VERSION}.lpk"
          mv output.lpk "$LPK_NAME"
          echo "LPK_FILE=$LPK_NAME" >> $GITHUB_ENV
          echo "Generated: $LPK_NAME"

      - name: Get tag version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: v$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LPTV v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            lzc/${{ env.LPK_FILE }}
