name: Release LPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.1.0)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install lzc-cli
        run: npm install -g @lazycatcloud/lzc-cli

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build LPK package
        env:
          LPK_VERSION: ${{ steps.version.outputs.version }}
          LPTV_CEF_LIB_URL: ${{ secrets.LPTV_CEF_LIB_URL }}
        run: bash lzc/package.sh

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          LPK_FILE="lzc/cloud.lazycat.app.lptv-${VERSION}.lpk"
          gh release delete "$GITHUB_REF_NAME" -y 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" \
            --title "LPTV v${VERSION}" \
            --generate-notes \
            "$LPK_FILE"
