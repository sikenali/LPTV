<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.png">
  <title>懒猫微视</title>
  <link rel="stylesheet" href="/ui.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    #lptv-loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: #000; flex-direction: column; gap: 16px;
    }
    #lptv-loader .spinner {
      width: 46px; height: 46px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.15);
      border-top-color: #4f7cff;
      animation: lptvmaskspin .8s linear infinite;
    }
    #lptv-loader .label { color: #6b7fae; font-size: 13px; letter-spacing: 1px; }
    @keyframes lptvmaskspin { to { transform: rotate(360deg); } }
    #lptv-loader.done { opacity: 0; transition: opacity .6s; pointer-events: none; }

    #lptv-error {
      position: fixed; inset: 0; z-index: 9998;
      display: none; align-items: center; justify-content: center;
      background: #0a0f1e; flex-direction: column; gap: 12px; color: #c7d3ed;
    }
    #lptv-error.show { display: flex; }
    #lptv-error h2 { color: #ff4d5e; font-size: 18px; }
    #lptv-error p { font-size: 13px; color: #6b7fae; max-width: 400px; text-align: center; line-height: 1.7; }
    #lptv-error button {
      margin-top: 8px; padding: 8px 20px; border-radius: 8px;
      background: rgba(79,124,255,.3); border: 1px solid rgba(79,124,255,.5);
      color: #fff; cursor: pointer; font-size: 13px;
    }
  </style>
</head>
<body>

  <div id="lptv-loader">
    <div class="spinner"></div>
    <div class="label">正在连接直播源…</div>
  </div>

  <div id="lptv-error">
    <h2>连接失败</h2>
    <p>无法连接到代理服务器。请确认代理已启动：<br>
       <code style="color:#7d9bff">python proxy/server.py</code><br>
       然后刷新本页面。</p>
    <button onclick="location.reload()">重试</button>
  </div>

  <div id="lptv-root" style="display:none"></div>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const customProxy = params.get("proxy");
      window.__LptvProxyBase = customProxy
        ? customProxy.replace(/\/$/, "")
        : location.protocol + "//" + location.host;
    })();
  </script>

  <script src="/state.js"></script>
  <script src="/api.js"></script>
  <script src="/layer.js"></script>
  <script src="/patch.js"></script>

  <script>
    (function boot() {
      const loader = document.getElementById("lptv-loader");
      const error = document.getElementById("lptv-error");
      const root = document.getElementById("lptv-root");

      async function checkProxy() {
        try {
          const r = await fetch(window.__LptvProxyBase + "/api/state", { signal: AbortSignal.timeout(3000) });
          if (!r.ok) throw new Error("HTTP " + r.status);
          return await r.json();
        } catch { return null; }
      }

      async function init() {
        const state = await checkProxy();
        if (!state) {
          error.classList.add("show");
          loader.style.display = "none";
          return;
        }
        const m = location.href.match(/[?&]pid=(\d+)/);
        const startPid = m ? m[1] : "";
        root.style.display = "block";
        loader.classList.add("done");
        setTimeout(() => loader.remove(), 700);
      }

      init().catch(err => {
        console.error("[LPTV] boot failed:", err);
        error.classList.add("show");
        loader.style.display = "none";
      });
    })();
  </script>
</body>
</html>
