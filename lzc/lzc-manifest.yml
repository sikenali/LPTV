application:
  subdomain: lptv
  background_task: true
  # 必须显式指定自带 node 的镜像：本地 lpk install 不解析 package.yml 的 runtime: node
  image: registry.lazycat.cloud/lzc-music/server:1.0.2
  routes:
    - /=file:///lzcapp/pkg/content/frontend
  upstreams:
    # 前端是 Vue 页面 + 一个指向 /_page 的同源 iframe, 所以官方直播页、EPG、
    # 录制/截图接口和 /capi 转发都必须由后端接管, 不能落到静态路由上。
    - location: /api/
      backend: http://127.0.0.1:8080/
      # 默认转发会去掉 location 前缀（/api/m3u -> /m3u），导致后端 404。
      # 保留前缀，使后端收到的仍是 /api/m3u（需 lzcos v1.3.9+）
      disable_trim_location: true
      backend_launch_command: sh /lzcapp/pkg/content/scripts/start-backend.sh
    - location: /_page
      backend: http://127.0.0.1:8080/
      disable_trim_location: true
      backend_launch_command: sh /lzcapp/pkg/content/scripts/start-backend.sh
    - location: /capi
      backend: http://127.0.0.1:8080/
      disable_trim_location: true
      backend_launch_command: sh /lzcapp/pkg/content/scripts/start-backend.sh
    - location: /proxy-video
      backend: http://127.0.0.1:8080/
      disable_trim_location: true
      backend_launch_command: sh /lzcapp/pkg/content/scripts/start-backend.sh
    # /_page 注入的 layer.js / api.js / state.js / ui.css 由后端从 STATIC_PATH 提供
    - location: /layer.js
      backend: http://127.0.0.1:8080/
      backend_launch_command: sh /lzcapp/pkg/content/scripts/start-backend.sh
    - location: /api.js
      backend: http://127.0.0.1:8080/
      backend_launch_command: sh /lzcapp/pkg/content/scripts/start-backend.sh
    - location: /state.js
      backend: http://127.0.0.1:8080/
      backend_launch_command: sh /lzcapp/pkg/content/scripts/start-backend.sh
    - location: /ui.css
      backend: http://127.0.0.1:8080/
      backend_launch_command: sh /lzcapp/pkg/content/scripts/start-backend.sh
  environment:
    BACKEND_PORT: "8080"
    FRONTEND_PORT: "5173"
    DATA_DIR: /lzcapp/var/data
    PORT: "8080"
    NODE_ENV: production
  health_check:
    test_url: http://127.0.0.1:8080/health
    start_period: 120s
    timeout: 10s
